<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title data-i18n="popupTitle"></title>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="icons/icon48.png" alt="Extension Icon">
            <h1 data-i18n="popupHeader"></h1>
        </div>
        
        <div class="settings-section">
            <span data-i18n="popupToggleLabel"></span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-switch" checked>
                <span class="slider"></span>
            </label>
        </div>

        <p class="status"></p>

        <div class="rules">
            <h2 data-i18n="popupRulesHeader"></h2>
            <div class="add-rule-form">
                <div class="action-type">
                    <label><input type="radio" name="actionType" value="redirect" checked> <span data-i18n="actionRedirect"></span></label>
                    <label><input type="radio" name="actionType" value="block"> <span data-i18n="actionBlock"></span></label>
                </div>
                <input type="text" id="old-domain" placeholder="Site Adresi (örn: eski.com)" required>
                <input type="text" id="new-domain" placeholder="Yönlendirilecek Adres (örn: yeni.com)">
                <button id="add-rule-btn" data-i18n="buttonAdd"></button>
            </div>
            <ul id="rules-list">
                <!-- Rules will be dynamically populated here -->
            </ul>
        </div>
    </div>
    <footer>
        <span id="version-info"></span>
    </footer>
    
    <!-- DEÄÄ°ÅÄ°KLÄ°K: browser-polyfill.js satÄ±rÄ± tamamen kaldÄ±rÄ±ldÄ± -->
    <script src="popup.js"></script>
</body>
</html>
